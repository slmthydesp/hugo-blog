{{ define "main" }}
<section class="page-section" aria-labelledby="tags-list-heading">
  <header class="section-header">
    <h1 id="tags-list-heading" class="section-title">标签</h1>
    <p class="section-lead">按标签浏览文章</p>
  </header>

  {{ with .Data.Terms.ByCount }}
  <ul class="tag-cloud">
    {{ range . }}
    <li>
      <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="tag-count">{{ .Count }}</span></a>
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p class="empty-hint">暂无标签。</p>
  {{ end }}
</section>
{{ end }}

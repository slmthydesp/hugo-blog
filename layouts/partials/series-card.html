<article class="series-card">
  <h3 class="card-title">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h3>
  {{ with .Params.summary }}
  <p class="card-summary">{{ . }}</p>
  {{ else }}
    {{ with .Summary }}
    <p class="card-summary">{{ . | plainify | truncate 120 }}</p>
    {{ end }}
  {{ end }}
  <p class="card-meta">{{ len .Pages }} 篇</p>
</article>

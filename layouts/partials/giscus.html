{{ $repo := site.Params.giscusRepo }}
{{ $repoId := site.Params.giscusRepoId }}
{{ $category := site.Params.giscusCategory }}
{{ $categoryId := site.Params.giscusCategoryId }}
{{ if and $repo $repoId $category $categoryId }}
<div class="giscus">
  <script
    src="https://giscus.app/client.js"
    data-repo="{{ $repo }}"
    data-repo-id="{{ $repoId }}"
    data-category="{{ $category }}"
    data-category-id="{{ $categoryId }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    crossorigin="anonymous"
    async></script>
</div>
{{ else }}
<aside class="giscus-placeholder" aria-label="评论">
  <p>评论尚未配置。配置 Giscus 仓库与 Discussions 分类后，讨论将显示在此处。</p>
</aside>
{{ end }}

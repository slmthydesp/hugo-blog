<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ "/" | relURL }}">首页</a>
      <a href="{{ "/posts/" | relURL }}">文章</a>
      <a href="{{ "/series/" | relURL }}">系列</a>
      <a href="{{ "/tags/" | relURL }}">标签</a>
    </nav>
    <div class="header-actions">
      {{ partial "search.html" . }}
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换主题" title="切换主题">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>

<div
  class="site-search"
  data-pagefind-url="{{ "pagefind/pagefind.js" | relURL }}"
>
  <label class="visually-hidden" for="site-search-input">搜索</label>
  <input
    id="site-search-input"
    type="search"
    placeholder="搜索…"
    aria-label="搜索"
    aria-autocomplete="list"
    aria-controls="site-search-results"
    autocomplete="off"
  />
  <ul
    id="site-search-results"
    class="search-results"
    role="listbox"
    aria-label="搜索结果"
    hidden
  ></ul>
</div>
